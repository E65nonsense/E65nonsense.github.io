baseURL = 'https://E65nonsense.github.io/'
locale = 'zh-cn'
title = 'E65nonsense 的博客'
theme = "PaperMod"
defaultTheme = "auto"

[params]
    ShowReadingTime = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowShareButtons = false
    ShowPostNavLinks = true
    ShowToc = true          # 文章页显示目录
    TocOpen = false         # 目录默认折叠
    comments = false        # 暂时关评论

    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/E65nonsense"
        title = "前往我的 GITHUB 主页"

[params.homeInfoParams]
    Title = "有朋自远方来，不亦乐乎！"

